<article class="group relative rounded-2xl bg-[#111a31] border border-slate-800 hover:border-slate-700 p-4 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1.5 hover:shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
  
  <div>
    <!-- Media / Image container -->
    <div class="relative h-48 rounded-xl overflow-hidden bg-slate-900 mb-4 flex items-center justify-center">
      @if (imagenPrincipal(); as imagen) {
        <img [src]="imagen.url"
             [alt]="camara().nombre"
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
             loading="lazy" />
      } @else {
        <div class="flex flex-col items-center justify-center text-slate-500 gap-1">
          <svg class="w-8 h-8 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span class="text-[11px]">Sin imagen principal</span>
        </div>
      }

      <!-- Top Badges Overlay -->
      <div class="absolute top-2.5 left-2.5 flex flex-col gap-1">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900/85 backdrop-blur-md text-slate-200 border border-slate-700">
          {{ camara().marca }}
        </span>
        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900/85 backdrop-blur-md text-[#ff7189] border border-slate-700">
          {{ camara().resolucion }}
        </span>
      </div>

      <!-- Stock Pill -->
      <div class="absolute top-2.5 right-2.5">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold border"
              [class.bg-emerald-500/20]="camara().stock > 3"
              [class.text-emerald-300]="camara().stock > 3"
              [class.border-emerald-500/30]="camara().stock > 3"
              [class.bg-amber-500/20]="camara().stock > 0 && camara().stock <= 3"
              [class.text-amber-300]="camara().stock > 0 && camara().stock <= 3"
              [class.border-amber-500/30]="camara().stock > 0 && camara().stock <= 3"
              [class.bg-rose-500/20]="camara().stock <= 0"
              [class.text-rose-300]="camara().stock <= 0"
              [class.border-rose-500/30]="camara().stock <= 0">
          {{ etiquetaStock() }}
        </span>
      </div>
    </div>

    <!-- Product Details -->
    <div class="space-y-1.5 mb-4">
      <div class="text-[11px] font-mono text-slate-400 font-medium">
        {{ camara().modelo }}
      </div>
      <h3 class="text-base font-bold text-white group-hover:text-[#ff7189] transition-colors line-clamp-2">
        <a [routerLink]="['/camaras', camara().id]">{{ camara().nombre }}</a>
      </h3>
      <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
        {{ descripcionCorta() }}
      </p>
    </div>
  </div>

  <!-- Bottom Price & CTA -->
  <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between gap-3">
    <div>
      <span class="text-[10px] text-slate-400 block font-medium">Precio</span>
      <span class="text-lg font-extrabold text-white">{{ camara().precio | currency:'PEN ':'symbol':'1.2-2' }}</span>
    </div>

    <a [routerLink]="['/camaras', camara().id]"
       class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#e94560] hover:bg-[#d1354e] shadow-[0_4px_12px_rgba(233,69,96,0.3)] transition-all hover:-translate-y-0.5">
      <span>Ver detalle</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>
  </div>

</article>
