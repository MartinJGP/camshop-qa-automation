<div class="flex flex-col items-center justify-center p-12 text-center my-8">
  <div class="relative w-16 h-16 mb-4">
    <!-- Outer ring spinner -->
    <div class="w-16 h-16 rounded-full border-4 border-slate-800 border-t-[#e94560] animate-spin"></div>
    <!-- Inner pulsing dot -->
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="w-3 h-3 rounded-full bg-[#ff7189] animate-ping"></div>
    </div>
  </div>
  <h3 class="text-sm font-bold text-white tracking-wide mb-1">{{ mensaje }}</h3>
  <p class="text-xs text-slate-400 font-mono">{{ subtitulo }}</p>
</div>
